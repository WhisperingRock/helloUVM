name: UVM CI 

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build UVM Docker image
        run: docker build \
            --build-arg VERILATOR_REF=stable \
            --build-arg UVM_REF=1800.2-2017-1.0 \
            -t uvm-ci:latest \
            .

      - name: Run UVM smoke test
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            uvm-ci:latest \
            make test TEST=dut_model_test SEED=1


      - name: Run lint
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            uvm-ci:latest \
            make lint
